[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-api"
version = "0.1.0"
description = "Face Recognition Web Service"
requires-python = ">=3.9"
dependencies = [
    "face_recognition",
    "flask"
]

[tool.vercel]
entrypoint = "examples.web_service_example:app"
